<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

  <title>Sage</title>

  <!-- Sage Favicon -->
  <link rel="icon" type="image/png" href="Sage.png" />
  <link rel="apple-touch-icon" href="Sage.png" />

  <link rel="stylesheet" href="style.css" />

  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>
  <div class="app">

    <!-- Mobile scrim -->
    <div id="scrim" class="scrim"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">

      <!-- Sage branding -->
      <div class="sage-brand">
        <img
          src="Sage.png"
          alt="Sage"
          class="sage-logo-image"
        />

        <span class="sage-brand-name">SAGE</span>
      </div>

      <div class="sidebar-header">

        <button id="newChatBtn" class="new-chat-btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>

          <span>New chat</span>
        </button>

        <button
          id="closeSidebarBtn"
          class="icon-btn mobile-only"
          aria-label="Close sidebar"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

      </div>

      <div id="chatList" class="chat-list"></div>

      <!-- Account / credits -->
      <div class="sidebar-footer">

        <div class="credits">

          <p>
            Built by <strong>TheSageAI</strong>
          </p>

          <div id="userArea" class="user-area"></div>

          <p class="github-link">
            <a
              href="https://github.com/Sigma-boy12-dev-67/Sage"
              target="_blank"
              rel="noopener noreferrer"
            >
              GitHub
            </a>
          </p>

        </div>

      </div>

    </aside>

    <!-- Main -->
    <main class="main">

      <header class="topbar">

        <button
          id="openSidebarBtn"
          class="icon-btn mobile-only"
          aria-label="Open sidebar"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <h1 id="chatTitle" class="chat-title">New chat</h1>

      </header>

      <div id="messagesContainer" class="messages-container">

        <div id="welcomeScreen" class="welcome-screen">

          <h2>What can I help with?</h2>

          <div class="suggestion-grid">

            <button
              class="suggestion-card"
              data-prompt="Explain quantum computing in simple terms"
            >
              <span class="suggestion-title">Explain a concept</span>
              <span class="suggestion-sub">
                quantum computing in simple terms
              </span>
            </button>

            <button
              class="suggestion-card"
              data-prompt="Write a short email asking my landlord to fix the heater"
            >
              <span class="suggestion-title">Draft an email</span>
              <span class="suggestion-sub">
                asking my landlord to fix the heater
              </span>
            </button>

            <button
              class="suggestion-card"
              data-prompt="Give me 5 creative dinner ideas using chicken and rice"
            >
              <span class="suggestion-title">Brainstorm ideas</span>
              <span class="suggestion-sub">
                dinner ideas using chicken and rice
              </span>
            </button>

            <button
              class="suggestion-card"
              data-prompt="Write a Python function that checks if a string is a palindrome"
            >
              <span class="suggestion-title">Help me code</span>
              <span class="suggestion-sub">
                a palindrome checker function in Python
              </span>
            </button>

          </div>

        </div>

        <div id="messages" class="messages"></div>

      </div>

      <!-- Composer -->
      <div class="composer-wrap">

        <div class="composer">

          <textarea
            id="composerInput"
            class="composer-input"
            placeholder="Message Sage..."
            rows="1"
          ></textarea>

          <button
            id="sendBtn"
            class="send-btn"
            aria-label="Send message"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>

        </div>

        <p class="composer-hint">
          Enter to send · Shift+Enter for a new line
        </p>

      </div>

    </main>
  </div>

  <!-- Delete modal -->
  <div id="modalOverlay" class="modal-overlay">

    <div class="modal">

      <h3>Delete chat?</h3>

      <p id="modalMessage">
        This will permanently delete this conversation.
      </p>

      <div class="modal-actions">

        <button
          id="modalCancelBtn"
          class="btn btn-secondary"
        >
          Cancel
        </button>

        <button
          id="modalConfirmBtn"
          class="btn btn-danger"
        >
          Delete
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
